<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isbely</title>
</head>
<body>
    <header>Por: Isabely de Sousa Nascimento</header>
    <main>
        <section>
            <h3>Clique para conhecer o site!</h3>
            <button onclick="mostrarMensagem()">Clique no botão!</button>
        </section>
    </main>
    <h4>Informe a sua idade!!</h4>
    <input type="number" id="entrada" placeholder="Digite sua idade: ">
    <button onclick="verificar()">Confirme sua idade</button>
    

    <p id="psaida"></p>
    <script>
        function verificar(){
            let idade = document.getElementById("entrada").value;
            document.getElementById("psaida").innerText = idade
        }
    </script>
    <script src="./script.js"></script>
    
</body>
</html>
