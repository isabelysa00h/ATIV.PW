<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTADOR</title>
</head>
<body>
    <h1>Contador</h1>
    <button onclick="contar()">Mostrar Números</button>

  <p id="resultado"></p>

  <script>
    function contar() {
      let texto = "";
      for (i = 1; i <= 10; i++) {
        texto += i + "<br>";
      }

      document.getElementById("resultado").innerHTML = texto;
    }
  </script>
</body>
</html>
